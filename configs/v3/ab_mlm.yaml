# Local pre-rental gate 2 (T2_PLAN.md section 7): RTD vs MLM at EQUAL WALL-CLOCK on the 5060 Ti.
# 8L x 512 proxy of the 24L x 768 T2 model; identical data, tokenizer, schedule and seed; only
# pretrain.objective differs. Winner = higher val decision accuracy after the same fine-tune.
model: {name: ab-mlm, hidden_size: 512, num_layers: 8, num_heads: 8, head_dim: 64, ffn_size: 1408, set_layers: 2, max_seq_len: 512, qk_norm: true}
training: {seed: 42, learning_rate: 0.001, min_lr_ratio: 0.1, weight_decay: 0.1, warmup_steps: 300, decay_ratio: 0.2,
           batch_rows: 64, micro_rows: 32, max_steps: 1000000, eval_every: 500, compile: true}
loss: {brier_weight: 0.5, rps_weight: 1.0, selective_weight: 0.1}
data: {tokenizer_path: data/pretrain/v3/tokenizer_v3_32k.json, decision_dir: data/decision/v3_real_check, max_seq_len: 512}
logging: {output_dir: runs/ab_obj/mlm, log_every: 50}
pretrain:
  objective: mlm
  seq_len: 512
  mask_prob: 0.15
  gen_layers: 2
  rtd_weight: 50.0
  val_holdout_tokens: 500000
  save_minutes: 10
  ext_seq_len: 1024
  ext_rope_base: 80000.0
  ext_micro_rows: 8
  sources:
    - {path: data/pretrain/v3_local/fineweb_edu.bin, weight: 60, name: fineweb_edu}
    - {path: data/pretrain/v3_local/cosmopedia.bin, weight: 15, name: cosmopedia}
    - {path: data/pretrain/v3_local/finemath.bin, weight: 8, name: finemath}
    - {path: data/pretrain/v3_local/wikipedia.bin, weight: 8, name: wikipedia}
    - {path: data/pretrain/v3_local/synthetic.bin, weight: 9, name: structured_and_decision_text}
stages: {pretrain: 0.667, pretrain_ext: 0.0, decisions: 0.25, rlcd: 0.0}
