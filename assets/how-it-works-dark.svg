<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="State in, decision out"><style>
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
</style><rect width="820" height="300" rx="16" fill="#111114" stroke="#2A2A30"/><text x="32" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#F5F7F2">State in, decision out</text><text x="32" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#A8ADA5">No free text: one option, a calibrated probability, and a flag for when to hand over.</text><rect x="32" y="96" width="250" height="170" rx="12" fill="#09090B" stroke="#2A2A30"/><text x="48" y="122" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6F746D" text-anchor="start">STATE</text><text x="48" y="144" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#A8ADA5" text-anchor="start">Refund policy: refunds within</text><text x="48" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#A8ADA5" text-anchor="start">30 days for unused items.</text><text x="48" y="180" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#A8ADA5" text-anchor="start">Case: delivered 45 days ago.</text><text x="48" y="208" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6F746D" text-anchor="start">QUESTION + OPTIONS</text><text x="48" y="228" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#A8ADA5" text-anchor="start">Approve the refund?</text><text x="48" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#A8ADA5" text-anchor="start">approve | deny | escalate</text><rect x="335" y="136" width="150" height="90" rx="12" fill="#D6FF4B" stroke="#D6FF4B"/><text x="410" y="176" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#09090B" text-anchor="middle">VerQen</text><text x="410" y="198" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#09090B" text-anchor="middle">232M, ~5 ms</text><rect x="538" y="96" width="250" height="170" rx="12" fill="#09090B" stroke="#2A2A30"/><text x="554" y="122" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6F746D" text-anchor="start">TYPED DECISION</text><text x="554" y="148" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F5F7F2" text-anchor="start">selected: deny_refund</text><text x="554" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#A8ADA5" text-anchor="start">p_correct: 0.67</text><text x="554" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#A8ADA5" text-anchor="start">prediction set: deny, escalate</text><text x="554" y="216" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#D6FF4B" text-anchor="start">should_escalate: true</text><text x="554" y="240" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6F746D" text-anchor="start">act when sure, route the rest</text><line x1="288" y1="181" x2="330" y2="181" stroke="#D6FF4B" stroke-width="2"/><path d="M330 176 L336 181 L330 186 Z" fill="#D6FF4B"/><circle r="3.5" cy="181" fill="#D6FF4B"><animate attributeName="cx" values="288;330" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></circle><line x1="490" y1="181" x2="532" y2="181" stroke="#D6FF4B" stroke-width="2"/><path d="M532 176 L538 181 L532 186 Z" fill="#D6FF4B"/><circle r="3.5" cy="181" fill="#D6FF4B"><animate attributeName="cx" values="490;532" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></circle></svg>