<svg xmlns="http://www.w3.org/2000/svg" width="820" height="328" viewBox="0 0 820 328" role="img" aria-label="Speed and cost"><style>
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
</style><rect width="820" height="328" rx="16" fill="#111114" stroke="#2A2A30"/><text x="32" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#F5F7F2">Speed and cost</text><text x="32" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#A8ADA5">VerQen answers in about 5 ms: 80x faster than the Jev API and 16x cheaper per decision.</text><text x="32" y="116" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F5F7F2">Latency per decision, p50 (ms)</text><text x="208" y="137" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#F5F7F2" font-weight="600">VerQen</text><rect class="bar" style="animation-delay:0.00s" x="220" y="126" width="6.2" height="14" rx="4" fill="#D6FF4B"/><text x="234.2" y="137" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F5F7F2">5.5 ms</text><text x="208" y="157" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#A8ADA5">Jev 1.13</text><rect class="bar" style="animation-delay:0.08s" x="220" y="146" width="497.5" height="14" rx="4" fill="#8A8F87"/><text x="725.5" y="157" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#A8ADA5">440.1 ms</text><text x="208" y="177" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#A8ADA5">Laya</text><rect class="bar" style="animation-delay:0.16s" x="220" y="166" width="29.8" height="14" rx="4" fill="#50544E"/><text x="257.8" y="177" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#A8ADA5">26.4 ms</text><text x="32" y="228" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F5F7F2">Cost per 1M decisions (USD)</text><text x="208" y="249" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#F5F7F2" font-weight="600">VerQen</text><rect class="bar" style="animation-delay:0.00s" x="220" y="238" width="31.4" height="14" rx="4" fill="#D6FF4B"/><text x="259.4" y="249" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F5F7F2">$1.81</text><text x="208" y="269" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#A8ADA5">Jev 1.13</text><rect class="bar" style="animation-delay:0.08s" x="220" y="258" width="497.1" height="14" rx="4" fill="#8A8F87"/><text x="725.1" y="269" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#A8ADA5">$28.68</text><text x="208" y="289" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#A8ADA5">Laya</text><rect class="bar" style="animation-delay:0.16s" x="220" y="278" width="103.5" height="14" rx="4" fill="#50544E"/><text x="331.5" y="289" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#A8ADA5">$5.97</text><text x="32" y="308" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6F746D">Laya-parity track. VerQen and Laya on one RTX 5060 Ti; Jev via OpenRouter (includes network). Cost: L4-class GPU at $0.80/h; Jev as billed.</text></svg>